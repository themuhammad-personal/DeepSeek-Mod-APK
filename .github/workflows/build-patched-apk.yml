name: Build the patched DeepSeek APK

# Builds the patched APK and keeps it as an artifact of the run.
#
# The official app is not redistributable, so the APK is neither committed to
# this repository nor published as a release. It is an artifact of this run,
# it expires and it is only meant for the owner of this repository and for the
# device tests. The signature is a throwaway key of the build, so the app
# cannot update an official installation in place.
#
# The build uses the newest file that the official download address serves.
# When that file is a build that this project has not inspected, the patches
# refuse to patch it and the run fails with a readable message, which is the
# wanted behaviour: the fingerprint set of that build has to be read out of
# it first.
#
# Nothing here bypasses or rewrites login, session, anti-fraud or integrity
# behaviour.

on:
  workflow_dispatch:
  push:
    branches:
      - "work/**"
      - "arena/**"
    paths:
      - ".github/workflows/build-patched-apk.yml"
      - "patches/**"
      - "extensions/**"
      - "scripts/verify_fingerprints.py"
      - "scripts/verify_patched_hooks.py"
      - "scripts/verify_login_untouched.py"
      - "scripts/verify_native_only.py"

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.0.0/dexdump"

      - name: Download the newest official APK
        shell: bash
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/deepseek-build"
          mkdir -p "$WORK"
          status=0
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --max-time 900 \
            -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" \
            "https://download.deepseek.com/apk/deepseek.apk" \
            --output "$WORK/original.apk" || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The official download address could not be read, so there is nothing to patch."
            exit 1
          fi
          echo "original APK SHA-256: $(sha256sum "$WORK/original.apk" | awk '{print $1}')"
          echo "original APK size: $(stat -c%s "$WORK/original.apk")"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$WORK/original.apk" \
            | grep -E "^package: name='com.deepseek.chat'" || true

      - name: Verify the fingerprint set of that build
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet --disable-pip-version-check androguard
          status=0
          python3 scripts/verify_fingerprints.py \
            "$RUNNER_TEMP/deepseek-build/original.apk" \
            > "$RUNNER_TEMP/fingerprint-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/fingerprint-verification.log"
          if [[ "$status" -ne 0 ]]; then
            tail -9 "$RUNNER_TEMP/fingerprint-verification.log" | tac | while IFS= read -r line; do
              printf '::error title=This build has no fingerprint set::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"

      - name: Run approval-first native core tests
        run: bash scripts/test-agent-core.sh

      - name: Build Morphe patch bundle
        shell: bash
        run: |
          set -uo pipefail
          status=0
          gradle --no-daemon buildAndroid > "$RUNNER_TEMP/gradle-build.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [[ "$status" -ne 0 ]]; then
            awk '/error:|FAILURE:/{keep=4} keep>0 {gsub(/\r/,""); print; keep--}' \
              "$RUNNER_TEMP/gradle-build.log" | head -36 | while IFS= read -r line; do
              printf '::error title=Morphe bundle build failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned Morphe Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar \
            --output "$RUNNER_TEMP/deepseek-build/morphe-desktop.jar"
          echo "3a2efefd567b44dde15971a58d5aa649a32aba30781d3400dc08d688c720168f $RUNNER_TEMP/deepseek-build/morphe-desktop.jar" | sha256sum --check

      - name: Apply the patches
        shell: bash
        run: |
          set -uo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)"
          test -n "$MPP"
          status=0
          java -Xms1024m -Xmx4g -jar "$RUNNER_TEMP/deepseek-build/morphe-desktop.jar" \
            patch --patches "$MPP" --exclusive --validate --bytecode-mode FULL \
            --enable "DeepSeek 2.7.4 compatibility check" \
            --enable "Native Agent hook points (experimental)" \
            --enable "Super DeepSeek native Agent Console" \
            --enable "Super DeepSeek native Agent chat entry" \
            --result-file "$RUNNER_TEMP/deepseek-build/patch-result.json" \
            --out "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-build/original.apk" \
            > "$RUNNER_TEMP/morphe-apply.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/morphe-apply.log"
          if [[ "$status" -ne 0 ]]; then
            tail -9 "$RUNNER_TEMP/morphe-apply.log" | tac | while IFS= read -r line; do
              printf '::error title=Morphe apply failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the Morphe patch result JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/deepseek-build/patch-result.json" <<'PYRESULT'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = [
              "DeepSeek 2.7.4 compatibility check",
              "Native Agent hook points (experimental)",
              "Super DeepSeek native Agent Console",
              "Super DeepSeek native Agent chat entry",
          ]
          applied = data.get("appliedPatches") or []
          failed = data.get("failedPatches") or []
          for name in expected:
              assert name in applied, f"patch was not applied: {name} (applied: {applied})"
          assert not failed, f"patches failed: {failed}"
          assert data.get("success") is True, "Morphe reports an unsuccessful patch run"
          print("the four patches were applied")
          PYRESULT

      - name: Verify the patched APK
        shell: bash
        run: |
          set -uo pipefail
          APK="$RUNNER_TEMP/deepseek-build/deepseek-patched.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -E "^package: name='com.deepseek.chat'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK" | head -5
          rm -rf "$RUNNER_TEMP/deepseek-build/dex"
          mkdir -p "$RUNNER_TEMP/deepseek-build/dex"
          unzip -o -q "$APK" '*.dex' -d "$RUNNER_TEMP/deepseek-build/dex"
          for dex in "$RUNNER_TEMP/deepseek-build/dex"/*.dex; do
            "$ANDROID_HOME/build-tools/36.0.0/dexdump" -f "$dex" > /dev/null
            echo "dexdump OK: $(basename "$dex")"
          done

      - name: Verify the hook call sites in the patched DEX
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 scripts/verify_patched_hooks.py \
            "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-build/original.apk" \
            > "$RUNNER_TEMP/hook-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/hook-verification.log"
          exit "$status"

      - name: Verify that the login of the app was not touched
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 scripts/verify_login_untouched.py \
            "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-build/original.apk" \
            > "$RUNNER_TEMP/login-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/login-verification.log"
          if [[ "$status" -ne 0 ]]; then
            grep -E "FAILED" "$RUNNER_TEMP/login-verification.log" | head -4 | while IFS= read -r line; do
              printf '::error title=The login must not be touched::%s\n' "${line//$'\r'/}"
            done
            grep -E "^          L" "$RUNNER_TEMP/login-verification.log" | head -8 | while IFS= read -r line; do
              printf '::error title=A class that does not belong to the extension::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"

      - name: Verify that the app stays a native Android app
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 scripts/verify_native_only.py \
            "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-build/original.apk" \
            > "$RUNNER_TEMP/native-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/native-verification.log"
          if [[ "$status" -ne 0 ]]; then
            grep -E "FAILED" "$RUNNER_TEMP/native-verification.log" | head -4 | while IFS= read -r line; do
              printf '::error title=The app has to stay native::%s\n' "${line//$'\r'/}"
            done
          else
            grep -E "^          " "$RUNNER_TEMP/native-verification.log" | head -8 | while IFS= read -r line; do
              printf '::notice title=The files that the patches added::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"

      - name: Write the build report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## The patched DeepSeek APK of this run"
            echo
            echo "- original APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-build/original.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
            echo "- patched APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
            echo "- patched APK size: $(stat -c%s "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" 2>/dev/null || echo unavailable)"
            echo
            echo "The artifact is an artifact of this run only. The official app is not"
            echo "redistributable, so the file is neither committed nor published as a"
            echo "release. The signature is a throwaway key of the build, so the app"
            echo "cannot update an official installation in place."
          } | tee -a "$GITHUB_STEP_SUMMARY" || true
          {
            echo "patched APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
            echo "patched APK size: $(stat -c%s "$RUNNER_TEMP/deepseek-build/deepseek-patched.apk" 2>/dev/null || echo unavailable)"
            echo "artifact of this run: deepseek-patched-apk"
          } | while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            printf '::notice title=The patched APK of this run::%s\n' "${line//$'\r'/}"
          done

      - name: Upload the patched APK as an artifact of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-patched-apk
          path: ${{ runner.temp }}/deepseek-build/deepseek-patched.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove the temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/deepseek-build"
