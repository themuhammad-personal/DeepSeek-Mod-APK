name: Verify Morphe patch against official DeepSeek APK

on:
  push:
    branches:
      - "work/**"
      - "dev"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Run approval-first native core tests
        run: bash scripts/test-agent-core.sh

      - name: Build Morphe patch bundle
        run: gradle --no-daemon buildAndroid
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify official DeepSeek 2.7.4 sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deepseek-verify"
          curl --fail --location --retry 3 --max-time 300 \
            https://download.deepseek.com/apk/deepseek.apk \
            --output "$RUNNER_TEMP/deepseek-verify/deepseek.apk"
          echo "a868bad448c87444f6c825b5ddbfa23756ad34178ab08503d107ff8e29b4f022 $RUNNER_TEMP/deepseek-verify/deepseek.apk" | sha256sum --check

      - name: Download pinned Morphe Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar \
            --output "$RUNNER_TEMP/deepseek-verify/morphe-desktop.jar"
          echo "3a2efefd567b44dde15971a58d5aa649a32aba30781d3400dc08d688c720168f $RUNNER_TEMP/deepseek-verify/morphe-desktop.jar" | sha256sum --check

      - name: Apply only the compatibility and experimental hook patches
        shell: bash
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)"
          test -n "$MPP"
          java -Xms1024m -Xmx4g -jar "$RUNNER_TEMP/deepseek-verify/morphe-desktop.jar" \
            patch --patches "$MPP" --exclusive --validate --bytecode-mode FULL \
            --enable "DeepSeek 2.7.4 compatibility check" \
            --enable "Native Agent hook points (experimental)" \
            --verify-with-sdk "$ANDROID_HOME" \
            --result-file "$RUNNER_TEMP/deepseek-verify/patch-result.json" \
            --out "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-verify/deepseek.apk"
          test -s "$RUNNER_TEMP/deepseek-verify/patch-result.json"
          python3 - "$RUNNER_TEMP/deepseek-verify/patch-result.json" <<'PYRESULT'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          text = json.dumps(data).lower()
          for needle in ("deepseek 2.7.4 compatibility check", "native agent hook points (experimental)"):
              assert needle in text, f"patch result does not mention expected patch: {needle}"
          for key in ("success", "succeeded"):
              if key in data and isinstance(data[key], bool):
                  assert data[key], "Morphe reports an unsuccessful patch run"
          print("Morphe patch result JSON: PASS")
          PYRESULT

      - name: Verify patched APK package, version, signature and extension DEX
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/deepseek-verify/badging.txt"
          grep -F "package: name='com.deepseek.chat' versionCode='293' versionName='2.7.4'" "$RUNNER_TEMP/deepseek-verify/badging.txt"
          "$APKSIGNER" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              dex_names = [n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
              assert dex_names, 'patched APK contains no DEX files'
              merged = b''.join(z.read(n) for n in dex_names)
              required = [
                  b'Lcom/themuhammad/deepseekmod/extension/SdsCoreMarker;',
                  b'Lcom/themuhammad/deepseekmod/extension/SdsAgentHooks;',
                  b'Lcom/themuhammad/deepseekmod/extension/SdsToolCallParser;',
              ]
              for token in required:
                  assert token in merged, 'DEX extension class missing: ' + token.decode()
              assert b'beforePrompt' in merged, 'prompt hook call missing from DEX'
              assert b'observeResponse' in merged, 'response hook call missing from DEX'
          print('Patched APK verification: PASS; SDS extension and both hook references are present.')
          PY

      - name: Remove temporary third-party APK and patched APK
        if: always()
        run: rm -rf "$RUNNER_TEMP/deepseek-verify"
