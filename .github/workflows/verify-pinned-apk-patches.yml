name: Verify Morphe patches against the pinned DeepSeek target

# P0 apply-verification workflow.
#
# The pinned official APK (com.deepseek.chat 2.7.4, versionCode 293) is not
# redistributable and is never stored in this repository. This workflow therefore
# takes a hash-pinned HTTPS source for the pinned extraction bundle, rebuilds a
# content-equivalent APK from it and applies the Morphe patches to that APK.
#
# The rebuilt APK carries the pinned classes.dex, classes2.dex, classes3.dex,
# AndroidManifest.xml and resources.arsc byte for byte, so the fingerprints resolve
# against exactly the inspected target. It is not byte identical to the signed
# original and it is not signed with DeepSeek's certificate. Nothing here bypasses
# or rewrites login, session, anti-fraud or integrity behaviour.
#
# The source location is read from .github/pinned-source.env when that file exists.
# That file is not part of the project: it only points at the owner's own copy of
# the pinned extraction and it is meant to be deleted once a run has completed.

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL of the pinned extraction bundle (zip of the extracted official APK)"
        required: false
        type: string
        default: ""
      source_sha256:
        description: "SHA-256 of that bundle"
        required: false
        type: string
        default: ""
  push:
    branches:
      - "work/**"
      - "arena/**"
    paths:
      - ".github/pinned-source.env"
      - ".github/workflows/verify-pinned-apk-patches.yml"
      - "scripts/rebuild-pinned-apk.py"
      - "scripts/verify_patched_hooks.py"
      - "patches/**"
      - "extensions/**"

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve the pinned source location
        id: source
        shell: bash
        run: |
          set -euo pipefail
          url="$SOURCE_URL"
          sha="$SOURCE_SHA256"
          if [[ -f .github/pinned-source.env ]]; then
            # shellcheck disable=SC1091
            set -a; source .github/pinned-source.env; set +a
            url="${url:-${PINNED_SOURCE_URL:-}}"
            sha="${sha:-${PINNED_SOURCE_SHA256:-}}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [[ -z "$url" || -z "$sha" ]]; then
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pinned source is configured, so this run verified nothing."
          else
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.source.outputs.has_source == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.source.outputs.has_source == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Set up Android SDK
        if: steps.source.outputs.has_source == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

      - name: Run approval-first native core tests
        if: steps.source.outputs.has_source == 'true'
        run: bash scripts/test-agent-core.sh

      - name: Build Morphe patch bundle
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          status=0
          gradle --no-daemon buildAndroid > "$RUNNER_TEMP/gradle-build.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [[ "$status" -ne 0 ]]; then
            awk '/error:|FAILURE:/{keep=4} keep>0 {gsub(/\r/,""); print; keep--}' \
              "$RUNNER_TEMP/gradle-build.log" | head -36 | while IFS= read -r line; do
              printf '::error title=Morphe bundle build failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify the pinned extraction bundle
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.source.outputs.url }}"
          SHA="${{ steps.source.outputs.sha }}"
          [[ "$URL" == https://* ]] || { echo "::error::The source URL must use HTTPS."; exit 2; }
          [[ "$SHA" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::The source SHA-256 must be 64 hexadecimal characters."; exit 2; }
          mkdir -p "$RUNNER_TEMP/deepseek-verify"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --max-time 600 \
            "$URL" \
            --output "$RUNNER_TEMP/deepseek-verify/pinned-extraction.zip"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/deepseek-verify/pinned-extraction.zip" | awk '{print $1}')"
          if [[ "$ACTUAL_SHA" != "${SHA,,}" ]]; then
            echo "::error::Extraction bundle checksum mismatch. Expected $SHA but downloaded $ACTUAL_SHA."
            exit 1
          fi
          echo "$ACTUAL_SHA  $RUNNER_TEMP/deepseek-verify/pinned-extraction.zip" | sha256sum --check

      - name: Rebuild the pinned target APK and check its identity
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rebuild-pinned-apk.py \
            "$RUNNER_TEMP/deepseek-verify/pinned-extraction.zip" \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned-unaligned.apk"
          # Align the stored entries the way a release build would, so the rebuilt
          # container is accepted by the Android package parser.
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned-unaligned.apk" \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk" > "$RUNNER_TEMP/deepseek-verify/source-badging.txt"
          grep -F "package: name='com.deepseek.chat' versionCode='293' versionName='2.7.4'" "$RUNNER_TEMP/deepseek-verify/source-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/deepseek-verify/source-badging.txt"

      - name: Download pinned Morphe Desktop CLI
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar \
            --output "$RUNNER_TEMP/deepseek-verify/morphe-desktop.jar"
          echo "3a2efefd567b44dde15971a58d5aa649a32aba30781d3400dc08d688c720168f $RUNNER_TEMP/deepseek-verify/morphe-desktop.jar" | sha256sum --check

      - name: Apply the compatibility, hook and console patches
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)"
          test -n "$MPP"
          status=0
          # The Android SDK verifier is not used here on purpose. The official DeepSeek
          # APK references optional third-party SDK types that it does not bundle, and
          # the verifier inside the patcher aborts the rebuild on those pre-existing
          # references. The same checks run after the patch and are compared against
          # the unpatched target, which proves that the patch adds no new finding.
          java -Xms1024m -Xmx4g -jar "$RUNNER_TEMP/deepseek-verify/morphe-desktop.jar" \
            patch --patches "$MPP" --exclusive --validate --bytecode-mode FULL \
            --enable "DeepSeek 2.7.4 compatibility check" \
            --enable "Native Agent hook points (experimental)" \
            --enable "Super DeepSeek native Agent Console" \
            --enable "Super DeepSeek native Agent chat entry" \
            --result-file "$RUNNER_TEMP/deepseek-verify/patch-result.json" \
            --out "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk" \
            > "$RUNNER_TEMP/morphe-apply.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/morphe-apply.log"
          if [[ "$status" -ne 0 ]]; then
            # GitHub keeps only the first ten annotations of a step, so the tail of the
            # log is emitted first and the most recent lines are the ones that matter.
            tail -9 "$RUNNER_TEMP/morphe-apply.log" | tac | while IFS= read -r line; do
              printf '::error title=Morphe apply failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the Morphe patch result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          RESULT="$RUNNER_TEMP/deepseek-verify/patch-result.json"
          if [[ ! -s "$RESULT" ]]; then
            echo "::error title=Morphe patch result::Morphe did not write a patch result JSON."
            exit 0
          fi
          python3 - "$RESULT" > "$RUNNER_TEMP/result-annotations.txt" <<'PYRESULT'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"success={data.get('success')} reason={data.get('failureReason')}")
          print("applied=" + ", ".join(data.get("appliedPatches") or []))
          for patch in data.get("failedPatches") or []:
              print(f"FAILED PATCH: {patch.get('name')}")
              for line in (patch.get("error") or "").splitlines()[:12]:
                  print(f"  {line}")
          PYRESULT
          head -9 "$RUNNER_TEMP/result-annotations.txt" | while IFS= read -r line; do
            printf '::error title=Morphe patch result::%s\n' "${line//$'\r'/}"
          done
          cat "$RUNNER_TEMP/result-annotations.txt"

      - name: Check the Morphe patch result JSON
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/deepseek-verify/patch-result.json"
          python3 - "$RUNNER_TEMP/deepseek-verify/patch-result.json" <<'PYRESULT'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = [
              "DeepSeek 2.7.4 compatibility check",
              "Native Agent hook points (experimental)",
              "Super DeepSeek native Agent Console",
              "Super DeepSeek native Agent chat entry",
          ]
          applied = data.get("appliedPatches") or []
          failed = data.get("failedPatches") or []
          for name in expected:
              assert name in applied, f"patch was not applied: {name} (applied: {applied})"
          assert not failed, f"patches failed: {failed}"
          assert data.get("success") is True, "Morphe reports an unsuccessful patch run"
          print("Morphe patch result JSON: PASS")
          print("applied patches: " + ", ".join(applied))
          PYRESULT

      - name: Verify patched APK package, version, signature and manifest
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          DEXDUMP="$ANDROID_HOME/build-tools/36.0.0/dexdump"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/deepseek-verify/patched-badging.txt"
          grep -F "package: name='com.deepseek.chat' versionCode='293' versionName='2.7.4'" "$RUNNER_TEMP/deepseek-verify/patched-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -p 4 "$APK"
          # The console shows the memories, the artifacts and the MCP servers, so it
          # must not be reachable from another app.
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/deepseek-verify/patched-manifest.txt"
          CONSOLE_BLOCK="$RUNNER_TEMP/deepseek-verify/console-activity.txt"
          grep -F -A 12 "com.themuhammad.deepseekmod.extension.SdsAgentConsoleActivity" \
            "$RUNNER_TEMP/deepseek-verify/patched-manifest.txt" > "$CONSOLE_BLOCK"
          if grep -F "android:exported" "$CONSOLE_BLOCK" | grep -qF "0xffffffff"; then
            echo "::error title=The console must not be exported::The Agent Console Activity is exported, so another app could open it."
            exit 1
          fi
          if ! grep -qF "android:exported" "$CONSOLE_BLOCK"; then
            echo "::error title=The console must declare its exported state::The Agent Console Activity does not declare android:exported."
            exit 1
          fi
          if grep -qF "android.intent.category.LAUNCHER" "$CONSOLE_BLOCK"; then
            echo "::error title=The console must not have a launcher entry::The Agent Console Activity has a LAUNCHER filter, so the launcher could open it."
            exit 1
          fi
          # The Android SDK disassembler validates the DEX structure of every file.
          rm -rf "$RUNNER_TEMP/deepseek-verify/dex"
          mkdir -p "$RUNNER_TEMP/deepseek-verify/dex"
          unzip -o -q "$APK" '*.dex' -d "$RUNNER_TEMP/deepseek-verify/dex"
          for dex in "$RUNNER_TEMP/deepseek-verify/dex"/*.dex; do
            "$DEXDUMP" -f "$dex" > /dev/null
            echo "dexdump OK: $(basename "$dex")"
          done

      - name: Verify the hook call sites in the patched DEX
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet --disable-pip-version-check androguard
          status=0
          python3 scripts/verify_patched_hooks.py \
            "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk" \
            > "$RUNNER_TEMP/hook-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/hook-verification.log"
          if [[ "$status" -ne 0 ]]; then
            {
              grep -E "FAILED|MISSING|RESULT|undefined type" "$RUNNER_TEMP/hook-verification.log" || true
              tail -6 "$RUNNER_TEMP/hook-verification.log"
            } | tail -9 | while IFS= read -r line; do
              printf '::error title=Hook verification failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"

      - name: Write the verification report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Morphe apply verification"
            echo
            if [[ "${{ steps.source.outputs.has_source }}" != "true" ]]; then
              echo "NOT VERIFIED. No pinned source was configured for this run."
            else
              echo "- source bundle SHA-256: ${{ steps.source.outputs.sha }}"
              echo "- rebuilt target SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
              echo "- patched APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
              echo "- patched APK size: $(stat -c%s "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" 2>/dev/null || echo unavailable)"
              echo "- Morphe patch result: $(grep -m1 -o 'applied=.*' "$RUNNER_TEMP/result-annotations.txt" 2>/dev/null || echo unavailable)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # The same values are emitted as annotations, because the job log and the
          # step summary of a finished run cannot be read back through the API.
          {
            grep -E "SHA-256|size|applied=" "$GITHUB_STEP_SUMMARY" || true
            grep -E "OK      (beforePrompt|observeResponse|the patch introduced|unpatched target|patched APK)" \
              "$RUNNER_TEMP/hook-verification.log" 2>/dev/null || true
          } | head -9 | while IFS= read -r line; do
            printf '::warning title=P0 verification result::%s\n' "${line//$'\r'/}"
          done
          cat "$GITHUB_STEP_SUMMARY" || true

      - name: Remove temporary third-party APK and patched APK
        if: always()
        run: rm -rf "$RUNNER_TEMP/deepseek-verify"
