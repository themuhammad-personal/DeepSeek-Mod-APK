name: Verify Morphe patches against the pinned DeepSeek target

# P0 apply-verification workflow.
#
# The pinned official APK (com.deepseek.chat 2.7.4, versionCode 293) is not
# redistributable and is never stored in this repository. This workflow therefore
# takes a hash-pinned HTTPS source for the pinned extraction bundle, rebuilds a
# content-equivalent APK from it and applies the Morphe patches to that APK.
#
# The rebuilt APK carries the pinned classes.dex, classes2.dex, classes3.dex,
# AndroidManifest.xml and resources.arsc byte for byte, so the fingerprints resolve
# against exactly the inspected target. It is not byte identical to the signed
# original and it is not signed with DeepSeek's certificate. Nothing here bypasses
# or rewrites login, session, anti-fraud or integrity behaviour.

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL of the pinned extraction bundle (zip of the extracted official APK)"
        required: false
        type: string
        default: ""
      source_sha256:
        description: "SHA-256 of that bundle"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types:
      - verify-pinned-apk

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: ${{ inputs.source_url || github.event.client_payload.source_url }}
      SOURCE_SHA256: ${{ inputs.source_sha256 || github.event.client_payload.source_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Run approval-first native core tests
        run: bash scripts/test-agent-core.sh

      - name: Build Morphe patch bundle
        run: gradle --no-daemon buildAndroid
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify the pinned extraction bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_URL" ]] || { echo "::error::No pinned source URL configured."; exit 2; }
          [[ "$SOURCE_URL" == https://* ]] || { echo "::error::The source URL must use HTTPS."; exit 2; }
          [[ "$SOURCE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::The source SHA-256 must be 64 hexadecimal characters."; exit 2; }
          mkdir -p "$RUNNER_TEMP/deepseek-verify"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --max-time 600 \
            "$SOURCE_URL" \
            --output "$RUNNER_TEMP/deepseek-verify/pinned-extraction.zip"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/deepseek-verify/pinned-extraction.zip" | awk '{print $1}')"
          if [[ "$ACTUAL_SHA" != "${SOURCE_SHA256,,}" ]]; then
            echo "::error::Extraction bundle checksum mismatch. Expected $SOURCE_SHA256 but downloaded $ACTUAL_SHA."
            exit 1
          fi
          echo "$ACTUAL_SHA  $RUNNER_TEMP/deepseek-verify/pinned-extraction.zip" | sha256sum --check

      - name: Rebuild the pinned target APK and check its identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rebuild-pinned-apk.py \
            "$RUNNER_TEMP/deepseek-verify/pinned-extraction.zip" \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned-unaligned.apk"
          # Align the stored entries the way a release build would, so the rebuilt
          # container is accepted by the Android package parser.
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned-unaligned.apk" \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk" > "$RUNNER_TEMP/deepseek-verify/source-badging.txt"
          grep -F "package: name='com.deepseek.chat' versionCode='293' versionName='2.7.4'" "$RUNNER_TEMP/deepseek-verify/source-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/deepseek-verify/source-badging.txt"

      - name: Download pinned Morphe Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar \
            --output "$RUNNER_TEMP/deepseek-verify/morphe-desktop.jar"
          echo "3a2efefd567b44dde15971a58d5aa649a32aba30781d3400dc08d688c720168f $RUNNER_TEMP/deepseek-verify/morphe-desktop.jar" | sha256sum --check

      - name: Apply the compatibility, hook and console patches
        shell: bash
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)"
          test -n "$MPP"
          java -Xms1024m -Xmx4g -jar "$RUNNER_TEMP/deepseek-verify/morphe-desktop.jar" \
            patch --patches "$MPP" --exclusive --validate --bytecode-mode FULL \
            --enable "DeepSeek 2.7.4 compatibility check" \
            --enable "Native Agent hook points (experimental)" \
            --enable "Super DeepSeek native Agent Console" \
            --verify-with-sdk "$ANDROID_HOME" \
            --result-file "$RUNNER_TEMP/deepseek-verify/patch-result.json" \
            --out "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" \
            "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk"
          test -s "$RUNNER_TEMP/deepseek-verify/patch-result.json"
          python3 - "$RUNNER_TEMP/deepseek-verify/patch-result.json" <<'PYRESULT'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          text = json.dumps(data).lower()
          for needle in ("deepseek 2.7.4 compatibility check", "native agent hook points (experimental)", "super deepseek native agent console"):
              assert needle in text, f"patch result does not mention expected patch: {needle}"
          for key in ("success", "succeeded"):
              if key in data and isinstance(data[key], bool):
                  assert data[key], "Morphe reports an unsuccessful patch run"
          print("Morphe patch result JSON: PASS")
          PYRESULT

      - name: Verify patched APK package, version, signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/deepseek-verify/patched-badging.txt"
          grep -F "package: name='com.deepseek.chat' versionCode='293' versionName='2.7.4'" "$RUNNER_TEMP/deepseek-verify/patched-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F "com.themuhammad.deepseekmod.extension.SdsAgentConsoleActivity"

      - name: Verify the hook call sites in the patched DEX
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check androguard
          python3 scripts/verify_patched_hooks.py "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk"

      - name: Write the verification report
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Morphe apply verification"
            echo
            echo "- source bundle SHA-256: ${SOURCE_SHA256}"
            echo "- rebuilt target SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-verify/deepseek-pinned.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
            echo "- patched APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
            echo "- patched APK size: $(stat -c%s "$RUNNER_TEMP/deepseek-verify/deepseek-patched.apk" 2>/dev/null || echo unavailable)"
          } > "$RUNNER_TEMP/deepseek-verify/report.md"
          cat "$RUNNER_TEMP/deepseek-verify/report.md"
          {
            echo "## Morphe apply verification"
            echo
            cat "$RUNNER_TEMP/deepseek-verify/report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary third-party APK and patched APK
        if: always()
        run: rm -rf "$RUNNER_TEMP/deepseek-verify"
