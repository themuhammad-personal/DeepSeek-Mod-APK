name: Check the newest official DeepSeek release

# Reports what the official download address serves right now.
#
# The address is a moving latest-version endpoint, so this workflow does not
# pin anything and does not patch anything: it downloads the file, reads its
# version code and its checksum and checks whether the project has a
# fingerprint set for that version code. When the official app publishes a new
# build, this workflow says so and the fingerprint set of that build has to be
# read out of it, exactly like it was done for the builds with the version
# codes 293, 294 and 296.
#
# The file is deleted at the end of the job and never published. When the
# address cannot be read from the runner, the workflow says so and does not
# fail: the apply verification of the inspected builds does not depend on it.

on:
  workflow_dispatch:
  push:
    branches:
      - "work/**"
      - "arena/**"
    paths:
      - ".github/workflows/check-latest-release.yml"
      - "scripts/verify_fingerprints.py"
      - "patches/src/main/kotlin/com/themuhammad/deepseekmod/patches/DeepSeekTargetProfile.kt"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download the newest official APK and read its identity
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet --disable-pip-version-check androguard || true
          WORK="$RUNNER_TEMP/deepseek-latest"
          mkdir -p "$WORK"
          for url in "https://download.deepseek.com/apk/deepseek.apk" "https://download.deepseek.com/app/"; do
            status=0
            curl --proto '=https' --tlsv1.2 --location --retry 3 --max-time 900 \
              -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36" \
              -w "http code: %{http_code}, content type: %{content_type}, size: %{size_download}\n" \
              "$url" --output "$WORK/deepseek.apk" || status=$?
            echo "the exit code of the download from $url is $status"
            if [[ "$status" -eq 0 ]] && head -c 2 "$WORK/deepseek.apk" | grep -q "PK"; then
              echo "the file was downloaded from $url"
              break
            fi
            rm -f "$WORK/deepseek.apk"
          done
          if [[ ! -s "$WORK/deepseek.apk" ]]; then
            echo "::warning::The official download address could not be read from this runner, so this run reported nothing about the newest release."
            exit 0
          fi
          {
            echo "official APK SHA-256: $(sha256sum "$WORK/deepseek.apk" | awk '{print $1}')"
            echo "official APK size: $(stat -c%s "$WORK/deepseek.apk")"
          } > "$WORK/identity.txt" || true
          python3 - "$WORK/deepseek.apk" > "$WORK/package.txt" 2>/dev/null <<'PYCHECK' || true
          import sys
          from androguard.core.apk import APK
          apk = APK(sys.argv[1])
          print("package:", apk.get_package())
          print("version code:", apk.get_androidversion_code())
          print("version name:", apk.get_androidversion_name())
          print("min sdk:", apk.get_min_sdk_version())
          print("target sdk:", apk.get_target_sdk_version())
          PYCHECK
          cat "$WORK/identity.txt" || true
          cat "$WORK/package.txt" || true
          exit 0

      - name: Check whether the project has a fingerprint set for that build
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -s "$RUNNER_TEMP/deepseek-latest/deepseek.apk" ]]; then
            echo "There is no file to check, so this run verified nothing."
            exit 0
          fi
          status=0
          python3 scripts/verify_fingerprints.py \
            "$RUNNER_TEMP/deepseek-latest/deepseek.apk" \
            > "$RUNNER_TEMP/latest-fingerprints.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/latest-fingerprints.log" || true
          echo "the exit code of the fingerprint verification is $status"
          exit 0

      - name: Write the report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          WORK="$RUNNER_TEMP/deepseek-latest"
          SUMMARY="$RUNNER_TEMP/latest-summary.md"
          {
            echo "## The newest official DeepSeek release"
            echo
            cat "$WORK/identity.txt" 2>/dev/null || true
            echo
            cat "$WORK/package.txt" 2>/dev/null || true
          } > "$SUMMARY" || true
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" || true
          cat "$SUMMARY" || true
          {
            cat "$WORK/identity.txt" 2>/dev/null || true
            cat "$WORK/package.txt" 2>/dev/null || true
            grep -E "version code of the target|fingerprint set" \
              "$RUNNER_TEMP/latest-fingerprints.log" 2>/dev/null || true
          } | head -9 | while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            printf '::warning title=The newest official DeepSeek release::%s\n' "${line//$'\r'/}"
          done
          exit 0

      - name: Remove the temporary official APK
        if: always()
        run: rm -rf "$RUNNER_TEMP/deepseek-latest"
