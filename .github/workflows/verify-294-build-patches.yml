name: Verify Morphe patches against the DeepSeek build with the version code 294

# Apply verification for the second inspected build of DeepSeek 2.7.4.
#
# The build with the version code 294 is the same app version as the pinned
# build, but a different build: it is distributed as a split package and it is
# obfuscated on its own, so it has its own fingerprint set. This workflow proves
# that the patch bundle applies to that build as well and that the hooks land
# on the same instructions there.
#
# The APKM is not redistributable and is never stored in this repository. The
# workflow therefore takes a hash-pinned HTTPS source for the owner's own copy
# of the APKM, takes the base APK out of it and applies the Morphe patches to
# that APK.
#
# The source location is read from .github/pinned-294-source.env when that file
# exists. That file is not part of the project: it only points at the owner's
# own copy and it is meant to be deleted once a run has completed.
#
# Nothing here bypasses or rewrites login, session, anti-fraud or integrity
# behaviour, and the patched APK is signed with a throwaway key, so it never
# carries the signature of the original app.

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "HTTPS URL of the APKM of the build with the version code 294"
        required: false
        type: string
        default: ""
      source_sha256:
        description: "SHA-256 of that APKM"
        required: false
        type: string
        default: ""
  push:
    branches:
      - "work/**"
      - "arena/**"
    paths:
      - ".github/pinned-294-source.env"
      - ".github/workflows/verify-294-build-patches.yml"
      - "scripts/verify_patched_hooks.py"
      - "scripts/verify_fingerprints.py"
      - "patches/**"
      - "extensions/**"

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve the source location of the build with the version code 294
        id: source
        shell: bash
        run: |
          set -euo pipefail
          url="$SOURCE_URL"
          sha="$SOURCE_SHA256"
          if [[ -f .github/pinned-294-source.env ]]; then
            # shellcheck disable=SC1091
            set -a; source .github/pinned-294-source.env; set +a
            url="${url:-${PINNED_SOURCE_URL:-}}"
            sha="${sha:-${PINNED_SOURCE_SHA256:-}}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [[ -z "$url" || -z "$sha" ]]; then
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No source is configured for this run, so this run verified nothing."
          else
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.source.outputs.has_source == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.source.outputs.has_source == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Set up Android SDK
        if: steps.source.outputs.has_source == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.0.0/dexdump"

      - name: Download the APKM and take the base APK out of it
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.source.outputs.url }}"
          SHA="${{ steps.source.outputs.sha }}"
          [[ "$URL" == https://* ]] || { echo "::error::The source URL must use HTTPS."; exit 2; }
          [[ "$SHA" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::The source SHA-256 must be 64 hexadecimal characters."; exit 2; }
          mkdir -p "$RUNNER_TEMP/deepseek-294"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --max-time 600 \
            "$URL" \
            --output "$RUNNER_TEMP/deepseek-294/source.apkm"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/deepseek-294/source.apkm" | awk '{print $1}')"
          if [[ "$ACTUAL_SHA" != "${SHA,,}" ]]; then
            echo "::error::The checksum of the APKM does not match the pinned one. Expected $SHA but downloaded $ACTUAL_SHA."
            exit 1
          fi
          unzip -o -q "$RUNNER_TEMP/deepseek-294/source.apkm" base.apk -d "$RUNNER_TEMP/deepseek-294"
          test -s "$RUNNER_TEMP/deepseek-294/base.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$RUNNER_TEMP/deepseek-294/base.apk" > "$RUNNER_TEMP/deepseek-294/badging.txt"
          grep -F "package: name='com.deepseek.chat' versionCode='294' versionName='2.7.4'" "$RUNNER_TEMP/deepseek-294/badging.txt"
          echo "base APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-294/base.apk" | awk '{print $1}')"

      - name: Run approval-first native core tests
        if: steps.source.outputs.has_source == 'true'
        run: bash scripts/test-agent-core.sh

      - name: Verify the fingerprint set of the build with the version code 294
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet --disable-pip-version-check androguard
          status=0
          python3 scripts/verify_fingerprints.py \
            "$RUNNER_TEMP/deepseek-294/base.apk" \
            > "$RUNNER_TEMP/fingerprint-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/fingerprint-verification.log"
          if [[ "$status" -ne 0 ]]; then
            tail -9 "$RUNNER_TEMP/fingerprint-verification.log" | tac | while IFS= read -r line; do
              printf '::error title=Fingerprint verification failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"

      - name: Build Morphe patch bundle
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          status=0
          gradle --no-daemon buildAndroid > "$RUNNER_TEMP/gradle-build.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [[ "$status" -ne 0 ]]; then
            awk '/error:|FAILURE:/{keep=4} keep>0 {gsub(/\r/,""); print; keep--}' \
              "$RUNNER_TEMP/gradle-build.log" | head -36 | while IFS= read -r line; do
              printf '::error title=Morphe bundle build failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned Morphe Desktop CLI
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar \
            --output "$RUNNER_TEMP/deepseek-294/morphe-desktop.jar"
          echo "3a2efefd567b44dde15971a58d5aa649a32aba30781d3400dc08d688c720168f $RUNNER_TEMP/deepseek-294/morphe-desktop.jar" | sha256sum --check

      - name: Apply the compatibility, hook and console patches
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)"
          test -n "$MPP"
          status=0
          java -Xms1024m -Xmx4g -jar "$RUNNER_TEMP/deepseek-294/morphe-desktop.jar" \
            patch --patches "$MPP" --exclusive --validate --bytecode-mode FULL \
            --enable "DeepSeek 2.7.4 compatibility check" \
            --enable "Native Agent hook points (experimental)" \
            --enable "Super DeepSeek native Agent Console" \
            --enable "Super DeepSeek native Agent chat entry" \
            --result-file "$RUNNER_TEMP/deepseek-294/patch-result.json" \
            --out "$RUNNER_TEMP/deepseek-294/deepseek-294-patched.apk" \
            "$RUNNER_TEMP/deepseek-294/base.apk" \
            > "$RUNNER_TEMP/morphe-apply-294.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/morphe-apply-294.log"
          if [[ "$status" -ne 0 ]]; then
            tail -9 "$RUNNER_TEMP/morphe-apply-294.log" | tac | while IFS= read -r line; do
              printf '::error title=Morphe apply failed on the build with the version code 294::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the Morphe patch result JSON
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/deepseek-294/patch-result.json"
          python3 - "$RUNNER_TEMP/deepseek-294/patch-result.json" <<'PYRESULT'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = [
              "DeepSeek 2.7.4 compatibility check",
              "Native Agent hook points (experimental)",
              "Super DeepSeek native Agent Console",
              "Super DeepSeek native Agent chat entry",
          ]
          applied = data.get("appliedPatches") or []
          failed = data.get("failedPatches") or []
          for name in expected:
              assert name in applied, f"patch was not applied: {name} (applied: {applied})"
          assert not failed, f"patches failed: {failed}"
          assert data.get("success") is True, "Morphe reports an unsuccessful patch run"
          print("Morphe patch result JSON of the build with the version code 294: PASS")
          print("applied patches: " + ", ".join(applied))
          PYRESULT

      - name: Verify the patched APK package, version, signature and manifest
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/deepseek-294/deepseek-294-patched.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          DEXDUMP="$ANDROID_HOME/build-tools/36.0.0/dexdump"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/deepseek-294/patched-badging.txt"
          grep -F "package: name='com.deepseek.chat' versionCode='294' versionName='2.7.4'" "$RUNNER_TEMP/deepseek-294/patched-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"
          # The console shows the memories, the artifacts and the MCP servers, so it
          # must not be reachable from another app.
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/deepseek-294/patched-manifest.txt"
          CONSOLE_BLOCK="$RUNNER_TEMP/deepseek-294/console-activity.txt"
          grep -F -A 12 "com.themuhammad.deepseekmod.extension.SdsAgentConsoleActivity" \
            "$RUNNER_TEMP/deepseek-294/patched-manifest.txt" > "$CONSOLE_BLOCK"
          if grep -F "android:exported" "$CONSOLE_BLOCK" | grep -qF "0xffffffff"; then
            echo "::error title=The console must not be exported::The Agent Console Activity is exported, so another app could open it."
            exit 1
          fi
          if ! grep -qF "android:exported" "$CONSOLE_BLOCK"; then
            echo "::error title=The console must declare its exported state::The Agent Console Activity does not declare android:exported."
            exit 1
          fi
          if grep -qF "android.intent.category.LAUNCHER" "$CONSOLE_BLOCK"; then
            echo "::error title=The console must not have a launcher entry::The Agent Console Activity has a LAUNCHER filter, so the launcher could open it."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/deepseek-294/dex"
          mkdir -p "$RUNNER_TEMP/deepseek-294/dex"
          unzip -o -q "$APK" '*.dex' -d "$RUNNER_TEMP/deepseek-294/dex"
          for dex in "$RUNNER_TEMP/deepseek-294/dex"/*.dex; do
            "$DEXDUMP" -f "$dex" > /dev/null
            echo "dexdump OK: $(basename "$dex")"
          done

      - name: Verify the hook call sites in the patched DEX
        if: steps.source.outputs.has_source == 'true'
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 scripts/verify_patched_hooks.py \
            "$RUNNER_TEMP/deepseek-294/deepseek-294-patched.apk" \
            "$RUNNER_TEMP/deepseek-294/base.apk" \
            > "$RUNNER_TEMP/hook-verification-294.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/hook-verification-294.log"
          if [[ "$status" -ne 0 ]]; then
            {
              grep -E "FAILED|MISSING|RESULT|undefined type" "$RUNNER_TEMP/hook-verification-294.log" || true
              tail -6 "$RUNNER_TEMP/hook-verification-294.log"
            } | tail -9 | while IFS= read -r line; do
              printf '::error title=Hook verification failed on the build with the version code 294::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"

      - name: Write the verification report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Morphe apply verification of the build with the version code 294"
            echo
            if [[ "${{ steps.source.outputs.has_source }}" != "true" ]]; then
              echo "NOT VERIFIED. No source was configured for this run."
            else
              echo "- source APKM SHA-256: ${{ steps.source.outputs.sha }}"
              echo "- base APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-294/base.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
              echo "- patched APK SHA-256: $(sha256sum "$RUNNER_TEMP/deepseek-294/deepseek-294-patched.apk" 2>/dev/null | awk '{print $1}' || echo unavailable)"
              echo "- patched APK size: $(stat -c%s "$RUNNER_TEMP/deepseek-294/deepseek-294-patched.apk" 2>/dev/null || echo unavailable)"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          {
            grep -E "SHA-256|size" "$GITHUB_STEP_SUMMARY" || true
            grep -E "OK      (beforePrompt|observeResponse|the patch introduced|unpatched target|patched APK)" \
              "$RUNNER_TEMP/hook-verification-294.log" 2>/dev/null || true
          } | head -9 | while IFS= read -r line; do
            printf '::warning title=Verification result of the build with the version code 294::%s\n' "${line//$'\r'/}"
          done
          cat "$GITHUB_STEP_SUMMARY" || true

      - name: Remove the temporary third-party APK and the patched APK
        if: always()
        run: rm -rf "$RUNNER_TEMP/deepseek-294"
