name: Build Morphe patch bundle

on:
  push:
    branches:
      - "work/**"
      - "arena/**"
      - "final/**"
      - "dev"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run approval-first native core regression tests
        shell: bash
        run: |
          status=0
          bash scripts/test-agent-core.sh > "$RUNNER_TEMP/agent-core.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/agent-core.log"
          if [[ "$status" -ne 0 ]]; then
            {
              grep -E "error:|AssertionError|Exception" "$RUNNER_TEMP/agent-core.log" || true
              tail -6 "$RUNNER_TEMP/agent-core.log"
            } | head -9 | while IFS= read -r line; do
              printf '::error title=Native core test failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Build Morphe patches and DEX extension
        shell: bash
        run: |
          status=0
          gradle --no-daemon buildAndroid > "$RUNNER_TEMP/gradle-build.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [[ "$status" -ne 0 ]]; then
            # Surface the compiler or D8 error as a workflow annotation so that the
            # failure is readable without downloading the full run log.
            # Each compiler error is followed by the lines that name the missing
            # symbol and its location, so those lines are kept with the error.
            awk '/error:|FAILURE:/{keep=4} keep>0 {gsub(/\r/,""); print; keep--}' \
              "$RUNNER_TEMP/gradle-build.log" | head -36 | while IFS= read -r line; do
              printf '::error title=Morphe bundle build failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MPP bundle
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
