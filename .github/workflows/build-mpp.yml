name: Build Morphe patch bundle

on:
  push:
    branches:
      - "work/**"
      - "arena/**"
      - "dev"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run approval-first native core regression tests
        run: bash scripts/test-agent-core.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build Morphe patches and DEX extension
        shell: bash
        run: |
          status=0
          gradle --no-daemon buildAndroid > "$RUNNER_TEMP/gradle-build.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [[ "$status" -ne 0 ]]; then
            # Surface the compiler or D8 error as a workflow annotation so that the
            # failure is readable without downloading the full run log.
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:|Execution failed" \
              "$RUNNER_TEMP/gradle-build.log" | head -40 | while IFS= read -r line; do
              printf '::error title=Morphe bundle build failed::%s\n' "${line//$'\r'/}"
            done
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MPP bundle
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
