name: Build DeepSeek 2.7.5 (296) split APK set
on:
  push:
    branches:
      - "final/2.7.5-296-split-apk"
    paths:
      - ".github/workflows/build-deepseek-296-split.yml"
      - "scripts/repackage-signed-apks.sh"
      - "patches/**"
      - "extensions/**"
permissions:
  contents: read
  packages: read
concurrency:
  group: deepseek-296-split-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Patch, re-sign and package all 2.7.5 split APKs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out this final-build branch
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/36.0.0/dexdump"
      - name: Download and verify the exact uploaded APKS archive
        env:
          SOURCE_URL: https://drive.google.com/uc?export=download&id=1g_nQYH3UhKNjSHhQlwPEcejLe0ZBkz5-
          SOURCE_SHA256: 02e6dafdb37fb2be754d4dfd428d2cb9767a610f4de1fa30bce21f11dc14cd8c
        run: |
          set -euo pipefail
          [[ "$SOURCE_URL" == https://* ]] || { echo "::error::Source URL must use HTTPS."; exit 2; }
          [[ "$SOURCE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Source SHA-256 must be 64 hexadecimal characters."; exit 2; }
          mkdir -p "$RUNNER_TEMP/deepseek-296"
          # gdown follows Drive's virus-scan confirmation flow for large files.
          python3 -m pip install --quiet --disable-pip-version-check "gdown==5.2.0"
          gdown --fuzzy "$SOURCE_URL" --output "$RUNNER_TEMP/deepseek-296/source.apks"
          test -s "$RUNNER_TEMP/deepseek-296/source.apks"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/deepseek-296/source.apks" | sha256sum --check
      - name: Verify the original 2.7.5 versionCode 296 split set
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/deepseek-296/source.apks" "$RUNNER_TEMP/deepseek-296/original" <<'PY'
          import hashlib, pathlib, sys, zipfile
          source, output = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          expected = {
              "base.apk": "6befd98c06155b2b4583f57cd76d7b721e342fed77025a94b653e03e18b5c8a8",
              "split_config.arm64_v8a.apk": "4f9bbc031c799450cee4100687514e4b1dae8d082816f823840fdd2cd3344051",
              "split_config.xhdpi.apk": "3b7ce2d70fe06334bd533c04ef6d1f97a1a0d741a17eef230985a241c9b5cb7a",
          }
          output.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(source) as z:
              names = {pathlib.PurePosixPath(n).name for n in z.namelist() if n.lower().endswith(".apk")}
              if names != set(expected): raise SystemExit(f"unexpected split set: {sorted(names)}")
              for name, digest in expected.items():
                  data = z.read(name)
                  actual = hashlib.sha256(data).hexdigest()
                  print(f"{name}: {actual}")
                  if actual != digest: raise SystemExit(f"inner APK hash mismatch: {name}")
                  (output / name).write_bytes(data)
          print("The exact uploaded Play Store split package is verified.")
          PY
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          for apk in "$RUNNER_TEMP/deepseek-296/original"/*.apk; do
            badging="$("$AAPT" dump badging "$apk")"
            grep -q "package: name='com.deepseek.chat' versionCode='296'" <<<"$badging" || {
              echo "::error::Wrong package/versionCode: $(basename "$apk")"; exit 1;
            }
            if [[ "$(basename "$apk")" == "base.apk" ]]; then
              grep -q "versionName='2.7.5'" <<<"$badging" || { echo "::error::Wrong base versionName"; exit 1; }
            fi
          done
          "$AAPT" dump badging "$RUNNER_TEMP/deepseek-296/original/base.apk"
      - name: Run approval-first native regression tests
        run: bash scripts/test-agent-core.sh
      - name: Verify the exact 296 fingerprint set and instruction shapes
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check androguard
          python3 scripts/verify_fingerprints.py "$RUNNER_TEMP/deepseek-296/original/base.apk" --version-code 296
      - name: Build the Morphe patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gradle --no-daemon buildAndroid
          MPP="$(find patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)"
          test -n "$MPP"
          echo "MPP=$MPP" >> "$GITHUB_ENV"
      - name: Download and verify the pinned Morphe Desktop CLI
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar \
            --output "$RUNNER_TEMP/deepseek-296/morphe-desktop.jar"
          echo "3a2efefd567b44dde15971a58d5aa649a32aba30781d3400dc08d688c720168f $RUNNER_TEMP/deepseek-296/morphe-desktop.jar" | sha256sum --check
      - name: Apply the four native patches to base.apk
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          java -Xms1024m -Xmx4g -jar "$RUNNER_TEMP/deepseek-296/morphe-desktop.jar" \
            patch --patches "$MPP" --exclusive --validate --bytecode-mode FULL \
            --enable "DeepSeek 2.7.4 compatibility check" \
            --enable "Native Agent hook points (experimental)" \
            --enable "Super DeepSeek native Agent Console" \
            --enable "Super DeepSeek native Agent chat entry" \
            --result-file "$RUNNER_TEMP/deepseek-296/patch-result.json" \
            --out "$RUNNER_TEMP/deepseek-296/patched-base-morphe.apk" \
            "$RUNNER_TEMP/deepseek-296/original/base.apk" \
            > "$RUNNER_TEMP/deepseek-296/morphe-apply.log" 2>&1 || {
              cat "$RUNNER_TEMP/deepseek-296/morphe-apply.log"; exit 1;
            }
          cat "$RUNNER_TEMP/deepseek-296/morphe-apply.log"
          python3 - "$RUNNER_TEMP/deepseek-296/patch-result.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          expected={
            "DeepSeek 2.7.4 compatibility check",
            "Native Agent hook points (experimental)",
            "Super DeepSeek native Agent Console",
            "Super DeepSeek native Agent chat entry",
          }
          applied=set(data.get("appliedPatches") or [])
          failed=data.get("failedPatches") or []
          missing=expected-applied
          if not data.get("success") or failed or missing:
            raise SystemExit(f"Morphe patch failure: missing={sorted(missing)} failed={failed}")
          print("All four required patches were applied.")
          PY
      - name: Verify hook locations, untouched login and native-only extension
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check androguard
          PATCHED="$RUNNER_TEMP/deepseek-296/patched-base-morphe.apk"
          ORIGINAL="$RUNNER_TEMP/deepseek-296/original/base.apk"
          python3 scripts/verify_patched_hooks.py "$PATCHED" "$ORIGINAL"
          python3 scripts/verify_login_untouched.py "$PATCHED" "$ORIGINAL"
          python3 scripts/verify_native_only.py "$PATCHED" "$ORIGINAL"
          mkdir -p "$RUNNER_TEMP/deepseek-296/dex"
          unzip -o -q "$PATCHED" '*.dex' -d "$RUNNER_TEMP/deepseek-296/dex"
          for dex in "$RUNNER_TEMP/deepseek-296/dex"/*.dex; do
            "$ANDROID_HOME/build-tools/36.0.0/dexdump" -f "$dex" >/dev/null
          done
      - name: Prepare the signing key for the complete split set
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SDS_SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SDS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SDS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SDS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/deepseek-296/release.jks"
          if [[ -n "$SIGNING_KEY_BASE64" ]]; then
            [[ -n "$KEYSTORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]] || {
              echo "::error::Configure all SDS signing secrets."; exit 2;
            }
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$KEYSTORE"
            echo "A persistent signing key was loaded."
          else
            export KEYSTORE_PASSWORD="sds-temporary-$GITHUB_RUN_ID"
            export KEY_PASSWORD="$KEYSTORE_PASSWORD"
            export KEY_ALIAS="sds-temporary"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Super DeepSeek Mod, OU=Android, O=Owner Build, L=Dhaka, S=BD, C=BD" >/dev/null
            echo "::warning::Temporary one-run signing key. Configure persistent signing secrets before future update builds."
          fi
          {
            echo "SDS_KEYSTORE=$KEYSTORE"
            echo "SDS_KEY_ALIAS=$KEY_ALIAS"
            echo "SDS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SDS_KEY_PASSWORD=$KEY_PASSWORD"
            if [[ -n "$SIGNING_KEY_BASE64" ]]; then echo "SDS_PERSISTENT_KEY=true"; else echo "SDS_PERSISTENT_KEY=false"; fi
          } >> "$GITHUB_ENV"
      - name: Re-sign every split and assemble the installable APKS set
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deepseek-296/artifact"
          bash scripts/repackage-signed-apks.sh \
            "$RUNNER_TEMP/deepseek-296/source.apks" \
            "$RUNNER_TEMP/deepseek-296/patched-base-morphe.apk" \
            "$RUNNER_TEMP/deepseek-296/artifact/deepseek-mod-2.7.5-296.apks" \
            "$RUNNER_TEMP/deepseek-296/repackage"
      - name: Write build report
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/deepseek-296/artifact"
          (cd "$OUT" && sha256sum deepseek-mod-2.7.5-296.apks > deepseek-mod-2.7.5-296.apks.sha256)
          {
            echo "## DeepSeek 2.7.5 / versionCode 296 split build"
            echo
            echo "- Source APKS SHA-256: 02e6dafdb37fb2be754d4dfd428d2cb9767a610f4de1fa30bce21f11dc14cd8c"
            echo "- Base APK patched with all four Morphe patches."
            echo "- Both configuration splits re-signed with the same certificate as base.apk."
            echo "- Package: com.deepseek.chat; version: 2.7.5; versionCode: 296."
            echo "- Static hook, login-untouched and native-only checks passed."
            echo "- Persistent signing key: $SDS_PERSISTENT_KEY"
            echo "- Artifact: deepseek-mod-2.7.5-296.apks"
            if [[ "$SDS_PERSISTENT_KEY" != "true" ]]; then
              echo
              echo "WARNING: temporary signing key; future builds will not update this installation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the complete split APK set
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-mod-2.7.5-296-apks
          path: ${{ runner.temp }}/deepseek-296/artifact/*
          if-no-files-found: error
          retention-days: 7
